name: Blog Publish Poller

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - name: Check out blog
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find requested blog posts
        env:
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          BLOG_DATA_SOURCE_ID: ${{ vars.BLOG_DATA_SOURCE_ID }}
        run: npm run blog:poll
